name: backtest

on:
  push:
    paths: [sim/**, .github/workflows/backtest.yml]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 sim/research.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
